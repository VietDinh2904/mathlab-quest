<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="title description">
  <title id="title">Pairing the integers from 12 to 28</title>
  <desc id="description">Eight outside pairs each total 40, with 20 in the middle.</desc>
  <style>
    .bg{fill:#fffdf8}.ink{fill:#183153;font-family:Nunito,Arial,sans-serif;font-weight:800}.muted{fill:#6f7c91;font-family:Nunito,Arial,sans-serif;font-weight:700}.chip{stroke:#183153;stroke-width:2}.pair{font-size:17px;text-anchor:middle}.number{fill:#fff;font-size:15px;text-anchor:middle;dominant-baseline:middle}.center-number{fill:#183153}.caption{font-size:15px;text-anchor:middle}.brace{fill:none;stroke:#183153;stroke-width:2.5;stroke-linecap:round}.sum{fill:#326fd4;font-size:14px;text-anchor:middle}
  </style>
  <rect class="bg" width="800" height="310" rx="22"/>
  <text class="ink pair" x="400" y="34">Ghép số đầu với số cuối · Pair first and last</text>
  <g class="ink pair">
    <rect x="28" y="55" width="168" height="42" rx="14" fill="#fff0ec"/><text x="112" y="82">12 + 28 = 40</text>
    <rect x="220" y="55" width="168" height="42" rx="14" fill="#e9f1ff"/><text x="304" y="82">13 + 27 = 40</text>
    <rect x="412" y="55" width="168" height="42" rx="14" fill="#eafaf4"/><text x="496" y="82">14 + 26 = 40</text>
    <rect x="604" y="55" width="168" height="42" rx="14" fill="#fff4cf"/><text x="688" y="82">15 + 25 = 40</text>
    <rect x="76" y="108" width="168" height="42" rx="14" fill="#f4efff"/><text x="160" y="135">16 + 24 = 40</text>
    <rect x="268" y="108" width="168" height="42" rx="14" fill="#e7f7ff"/><text x="352" y="135">17 + 23 = 40</text>
    <rect x="460" y="108" width="168" height="42" rx="14" fill="#fff0ec"/><text x="544" y="135">18 + 22 = 40</text>
    <rect x="652" y="108" width="120" height="42" rx="14" fill="#eafaf4"/><text x="712" y="135">19 + 21 = 40</text>
  </g>
  <g>
    <circle class="chip" cx="64" cy="212" r="21" fill="#ff7a66"/><text class="ink number" x="64" y="212">12</text>
    <circle class="chip" cx="106" cy="212" r="21" fill="#4d8cf5"/><text class="ink number" x="106" y="212">13</text>
    <circle class="chip" cx="148" cy="212" r="21" fill="#5ac8a8"/><text class="ink number" x="148" y="212">14</text>
    <circle class="chip" cx="190" cy="212" r="21" fill="#ffc857"/><text class="ink number center-number" x="190" y="212">15</text>
    <circle class="chip" cx="232" cy="212" r="21" fill="#8d79eb"/><text class="ink number" x="232" y="212">16</text>
    <circle class="chip" cx="274" cy="212" r="21" fill="#54b7e9"/><text class="ink number" x="274" y="212">17</text>
    <circle class="chip" cx="316" cy="212" r="21" fill="#ff9a73"/><text class="ink number" x="316" y="212">18</text>
    <circle class="chip" cx="358" cy="212" r="21" fill="#5ac8a8"/><text class="ink number" x="358" y="212">19</text>
    <circle class="chip" cx="400" cy="212" r="23" fill="#ffc857"/><text class="ink number center-number" x="400" y="212">20</text>
    <circle class="chip" cx="442" cy="212" r="21" fill="#5ac8a8"/><text class="ink number" x="442" y="212">21</text>
    <circle class="chip" cx="484" cy="212" r="21" fill="#ff9a73"/><text class="ink number" x="484" y="212">22</text>
    <circle class="chip" cx="526" cy="212" r="21" fill="#54b7e9"/><text class="ink number" x="526" y="212">23</text>
    <circle class="chip" cx="568" cy="212" r="21" fill="#8d79eb"/><text class="ink number" x="568" y="212">24</text>
    <circle class="chip" cx="610" cy="212" r="21" fill="#ffc857"/><text class="ink number center-number" x="610" y="212">25</text>
    <circle class="chip" cx="652" cy="212" r="21" fill="#5ac8a8"/><text class="ink number" x="652" y="212">26</text>
    <circle class="chip" cx="694" cy="212" r="21" fill="#4d8cf5"/><text class="ink number" x="694" y="212">27</text>
    <circle class="chip" cx="736" cy="212" r="21" fill="#ff7a66"/><text class="ink number" x="736" y="212">28</text>
  </g>
  <path class="brace" d="M64 252Q400 298 736 252"/>
  <text class="ink sum" x="400" y="286">8 cặp × 40 + 20 · 8 pairs × 40 + 20</text>
</svg>
