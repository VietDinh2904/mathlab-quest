<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="t d">
  <title id="t">Repeating flower pattern</title><desc id="d">Tulip, simple flower, double flower, missing, pinwheel, then the sequence begins again.</desc>
  <rect width="1040" height="420" rx="28" fill="#fffaf2"/>
  <style>.box{fill:#fff;stroke:#17365f;stroke-width:3}.f{font:48px 'Segoe UI Emoji','Apple Color Emoji',sans-serif;text-anchor:middle}.q{font:900 42px system-ui;fill:#ef5f56;text-anchor:middle}.l{font:800 20px system-ui;fill:#17365f;text-anchor:middle}</style>
  <g transform="translate(35 40)">
    <rect class="box" x="0" y="0" width="92" height="100"/><text class="f" x="46" y="68">🌷</text>
    <rect class="box" x="96" y="0" width="92" height="100"/><text class="f" x="142" y="68">🌼</text>
    <rect class="box" x="192" y="0" width="92" height="100"/><text class="f" x="238" y="68">🌸</text>
    <rect class="box" x="288" y="0" width="92" height="100"/><text class="q" x="334" y="66">?</text>
    <rect class="box" x="384" y="0" width="92" height="100"/><text class="f" x="430" y="68">✿</text>
    <rect class="box" x="480" y="0" width="92" height="100"/><text class="f" x="526" y="68">🌷</text>
    <rect class="box" x="576" y="0" width="92" height="100"/><text class="f" x="622" y="68">🌼</text>
    <rect class="box" x="672" y="0" width="92" height="100"/><text class="q" x="718" y="66">?</text>
    <rect class="box" x="768" y="0" width="92" height="100"/><text class="f" x="814" y="68">🌹</text>
    <rect class="box" x="864" y="0" width="92" height="100"/><text class="f" x="910" y="68">✿</text>
  </g>
  <g transform="translate(90 215)">
    <text class="l" x="80" y="130">A</text><text class="f" x="45" y="65">🌹</text><text class="f" x="115" y="65">✿</text>
    <text class="l" x="280" y="130">B</text><text class="f" x="245" y="65">🌷</text><text class="f" x="315" y="65">✿</text>
    <text class="l" x="480" y="130">C</text><text class="f" x="445" y="65">🌸</text><text class="f" x="515" y="65">🌼</text>
    <text class="l" x="680" y="140">D</text><text class="f" x="645" y="65">🌹</text><text class="f" x="715" y="65">🌸</text>
    <text class="l" x="880" y="130">E</text><text class="q" x="880" y="66">∅</text>
  </g>
</svg>
